<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | نجاح</title>
<link rel="icon" type="image/png" href="/img/logo-icon.png">
<style>
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:#f7f8fb; margin:0; padding:20px; color:#1f2430;}
  .container{max-width:800px; margin:0 auto;}
  h1{font-size:20px; margin-bottom:6px;}
  .muted{color:#6b7280; font-size:13px; margin-bottom:16px;}
  .card{background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px; margin-bottom:12px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .btn{cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600;}
  .approve{background:#16a34a; color:#fff;} .reject{background:#dc2626; color:#fff;} .delete{background:#374151; color:#fff;}
  .suspend{background:#b45309; color:#fff;} .activate{background:#0d9488; color:#fff;} .reset{background:#4338ca; color:#fff;}
  .sub-ok{color:#16a34a; font-weight:700;} .sub-bad{color:#dc2626; font-weight:700;}
  input{padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; font-size:13px;}
  .empty{text-align:center; color:#6b7280; padding:30px;}
  .name{font-weight:700;} .tag{color:#1e5a78; font-size:12px;} .tag-center{color:#a21caf;}
  .tabs{display:flex; gap:6px; margin:10px 0;}
  .tabs button{flex:1; padding:8px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; cursor:pointer; font-size:13px;}
  .tabs button.active{background:#111827; color:#fff; border-color:#111827;}
</style>
</head>
<body>
<div class="container">
  <h1><img src="/img/logo-icon.png" alt="نجاح" style="height:26px;width:26px;object-fit:contain;vertical-align:middle;border-radius:50%;margin-inline-end:4px;"> نجاح — لوحة إدارة المدرسين والمراكز</h1>

  <div id="login-box">
    <p class="muted">سجّل دخولك كسوبر أدمن</p>
    <div class="card">
      <div style="margin-bottom:8px;"><input id="admin-username" placeholder="رقم الهاتف / اسم المستخدم" style="width:100%;"></div>
      <div style="margin-bottom:8px;"><input id="admin-password" type="password" placeholder="كلمة السر" style="width:100%;"></div>
      <button class="btn approve" style="width:100%;" onclick="adminLogin()">دخول</button>
      <div id="admin-login-error" style="color:#dc2626; font-size:13px; margin-top:8px; display:none;"></div>
    </div>
  </div>

  <div id="admin-content" style="display:none;">
    <div class="row" style="margin-bottom:8px;">
      <span class="muted" id="admin-whoami"></span>
      <div style="display:flex; gap:6px;">
        <button class="btn reset" onclick="changeAdminPassword()">تغيير كلمة السر</button>
        <button class="btn delete" onclick="adminLogout()">تسجيل خروج</button>
      </div>
    </div>
    <div class="card" id="stats-banner" style="display:none; text-align:center; font-weight:700;"></div>
    <div class="tabs">
      <button data-mode="providers" class="active" onclick="setMode('providers')">المدرسون والمراكز</button>
      <button data-mode="seekers" onclick="setMode('seekers')">أولياء الأمور والطلاب</button>
    </div>

    <div id="providers-section">
      <div class="tabs">
        <button data-status="pending" class="active" onclick="setTab('pending')">قيد المراجعة</button>
        <button data-status="approved" onclick="setTab('approved')">المعتمدون</button>
        <button data-status="rejected" onclick="setTab('rejected')">مرفوضون</button>
      </div>
      <div id="list"></div>
    </div>

    <div id="seekers-section" style="display:none;">
      <div class="tabs">
        <button data-stype="" class="active" onclick="setSeekerType('')">الكل</button>
        <button data-stype="parent" onclick="setSeekerType('parent')">أولياء الأمور</button>
        <button data-stype="student" onclick="setSeekerType('student')">الطلاب</button>
      </div>
      <div id="seeker-list"></div>
    </div>
  </div>
</div>
<script>
let currentStatus = "pending";
let currentSeekerType = "";
function setMode(mode){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle("active", b.dataset.mode===mode));
  document.getElementById("providers-section").style.display = mode==="providers" ? "block" : "none";
  document.getElementById("seekers-section").style.display = mode==="seekers" ? "block" : "none";
  if(mode==="seekers") loadSeekers();
}
function setSeekerType(t){
  currentSeekerType = t;
  document.querySelectorAll('[data-stype]').forEach(b=>b.classList.toggle("active", b.dataset.stype===t));
  loadSeekers();
}
async function loadSeekers(){
  const key = localStorage.getItem("nagah_admin_key");
  const res = await fetch("/api/admin/seekers?type="+currentSeekerType, { headers: { "x-admin-key": key } });
  const list = document.getElementById("seeker-list");
  if(!res.ok){ list.innerHTML = '<div class="empty">مفتاح غير صحيح أو حصل خطأ</div>'; return; }
  const rows = await res.json();
  list.innerHTML = rows.length ? rows.map(s=>`
    <div class="card">
      <div class="row">
        <div>
          <div class="name">${s.name} <span class="tag">${s.type==='parent'?'👪 ولي أمر':'🎒 طالب'}</span> ${s.active===false?'<span class="tag" style="color:#dc2626;">(موقوف)</span>':''}</div>
          <div style="font-size:13px; color:#6b7280;">📞 ${s.phone} | ${s.email||"بدون إيميل"} | 📍 ${s.country}${s.area?" - "+s.area:""}</div>
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">جنسية: ${s.nationality||"-"} | ميلاد: ${s.dob||"-"} | رقم قومي/مدني: ${s.national_id||"-"} ${s.type==='parent' ? ('| عدد الأطفال: '+s.children_count) : ""}</div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${s.active===false ? `<button class="btn activate" onclick="seekerAct(${s.id},'activate')">تفعيل</button>` : `<button class="btn suspend" onclick="seekerAct(${s.id},'suspend')">إيقاف</button>`}
          <button class="btn reset" onclick="seekerResetPw(${s.id})">إعادة ضبط كلمة السر</button>
          <button class="btn delete" onclick="seekerDel(${s.id})">حذف نهائي</button>
        </div>
      </div>
    </div>`).join("") : '<div class="empty">لا يوجد حسابات</div>';
}
async function seekerAct(id, action){
  const key = localStorage.getItem("nagah_admin_key");
  await fetch(`/api/admin/seekers/${id}/${action}`, { method:"POST", headers: { "x-admin-key": key } });
  loadSeekers();
}
async function seekerResetPw(id){
  if(!confirm("هيتم توليد كلمة سر جديدة عشوائية لهذا الحساب. متأكد؟")) return;
  const key = localStorage.getItem("nagah_admin_key");
  const res = await fetch(`/api/admin/seekers/${id}/reset-password`, { method:"POST", headers: { "x-admin-key": key } });
  const data = await res.json();
  if(data.new_password){ alert("كلمة السر الجديدة: "+data.new_password); } else { alert("حصل خطأ: "+(data.error||"غير معروف")); }
}
async function seekerDel(id){
  if(!confirm("متأكد إنك عايز تحذف هذا الحساب نهائيًا؟")) return;
  const key = localStorage.getItem("nagah_admin_key");
  await fetch(`/api/admin/seekers/${id}`, { method:"DELETE", headers: { "x-admin-key": key } });
  loadSeekers();
}
function setTab(s){
  currentStatus = s;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active", b.dataset.status===s));
  load();
}
function modeLabel(m){ return m==="online" ? "أونلاين" : m==="in_person" ? "حضوري" : "أونلاين وحضوري"; }
async function loadStats(key){
  const res = await fetch("/api/admin/stats", { headers: { "x-admin-key": key } });
  const banner = document.getElementById("stats-banner");
  if(!res.ok){ banner.style.display="none"; return; }
  const s = await res.json();
  banner.style.display = "block";
  banner.style.color = "#166534";
  banner.innerHTML = `🎁 المعلمات: باقي ${s.female_slots_left} من ${s.free_tutor_limit} اشتراك مجاني &nbsp;|&nbsp; المعلمين: باقي ${s.male_slots_left} من ${s.free_tutor_limit} اشتراك مجاني`;
}
async function load(){
  const key = localStorage.getItem("nagah_admin_key");
  loadStats(key);
  const res = await fetch("/api/admin/providers?status="+currentStatus, { headers: { "x-admin-key": key } });
  const list = document.getElementById("list");
  if(!res.ok){ list.innerHTML = '<div class="empty">مفتاح غير صحيح أو حصل خطأ</div>'; return; }
  const rows = await res.json();
  list.innerHTML = rows.length ? rows.map(p=>`
    <div class="card">
      <div class="row">
        <div>
          <div class="name">${p.name} <span class="${p.type==='center'?'tag-center':'tag'}">${p.type==='center' ? '🏫 مركز' : (p.gender==='male' ? '🧑‍🏫 معلم' : '🧑‍🏫 معلمة')} - ${p.stage||""} - ${p.subject}</span></div>
          <div style="font-size:13px; color:#6b7280;">📍 ${p.country}${p.area ? " - "+p.area : ""} | ${p.price} | 📞 ${p.phone} | ${modeLabel(p.mode)} | ${p.group_type==='group' ? 'مجموعة حتى '+p.max_students : 'فردي'} | دفع ${p.payment_method==='cash'?'نقدي':'تحويل'}</div>
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">${p.degree||""} ${p.experience_years?('- '+p.experience_years+' سنوات خبرة'):''} | جنسية: ${p.nationality||"-"} | ميلاد: ${p.dob||"-"} | رقم قومي/مدني: ${p.national_id||"-"}</div>
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">🕒 ${(p.availability_days&&p.availability_days.length) ? p.availability_days.join("، ") : "لم يحدد أيام"} ${(p.availability_from&&p.availability_to) ? ('| '+p.availability_from+' - '+p.availability_to) : ""}</div>
          ${p.subscription_start ? `<div style="font-size:12px; margin-top:4px;" class="${p.expired?'sub-bad':'sub-ok'}">📅 الاشتراك: من ${p.subscription_start.slice(0,10)} لحد ${p.subscription_end.slice(0,10)} — ${p.expired ? 'منتهي' : (p.days_left+' يوم متبقي')} ${p.active===false ? '(موقوف يدويًا)' : ''}</div>` : `<div style="font-size:12px; margin-top:4px;" class="sub-bad">📅 مفيش اشتراك فعال (العرض المجاني خلص أو لسه هيتقبل) — فعّل يدويًا:
            <input type="number" min="1" value="12" id="months-${p.id}" style="width:60px; display:inline-block; margin-inline:4px;"> شهر
            <button class="btn reset" style="padding:4px 10px;" onclick="setSub(${p.id})">تفعيل</button>
          </div>`}
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">${p.bio||""}</div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${currentStatus!=="approved" ? `<button class="btn approve" onclick="act(${p.id},'approve')">قبول</button>` : ""}
          ${currentStatus!=="rejected" ? `<button class="btn reject" onclick="act(${p.id},'reject')">رفض</button>` : ""}
          ${currentStatus==="approved" ? (p.active===false ? `<button class="btn activate" onclick="act(${p.id},'activate')">تفعيل الاشتراك</button>` : `<button class="btn suspend" onclick="act(${p.id},'suspend')">إيقاف الاشتراك</button>`) : ""}
          <button class="btn reset" onclick="resetPw(${p.id})">إعادة ضبط كلمة السر</button>
          <button class="btn delete" onclick="del(${p.id})">حذف نهائي</button>
        </div>
      </div>
    </div>`).join("") : '<div class="empty">لا يوجد أحد في هذه القائمة</div>';
}
async function act(id, action){
  const key = localStorage.getItem("nagah_admin_key");
  const res = await fetch(`/api/admin/providers/${id}/${action}`, { method:"POST", headers: { "x-admin-key": key } });
  const data = await res.json().catch(()=>({}));
  if(action==="approve" && data.got_free_year===false){
    alert("العرض المجاني لأول 100 مدرس خلص. المدرس اتقبل بس محتاج تفعيل اشتراك يدوي من تحت.");
  }
  load();
}
async function setSub(id){
  const months = document.getElementById("months-"+id).value;
  const key = localStorage.getItem("nagah_admin_key");
  await fetch(`/api/admin/providers/${id}/set-subscription`, { method:"POST", headers: { "Content-Type":"application/json", "x-admin-key": key }, body: JSON.stringify({months}) });
  load();
}
async function resetPw(id){
  if(!confirm("هيتم توليد كلمة سر جديدة عشوائية لهذا الحساب. متأكد؟")) return;
  const key = localStorage.getItem("nagah_admin_key");
  const res = await fetch(`/api/admin/providers/${id}/reset-password`, { method:"POST", headers: { "x-admin-key": key } });
  const data = await res.json();
  if(data.new_password){ alert("كلمة السر الجديدة: "+data.new_password+"\nابعتها للمدرس/المركز بنفسك (واتساب/إيميل)."); }
  else { alert("حصل خطأ: "+(data.error||"غير معروف")); }
}
async function del(id){
  if(!confirm("متأكد إنك عايز تحذف ده نهائيًا؟ هيتحذف مع تقييماته وحجوزاته.")) return;
  const key = localStorage.getItem("nagah_admin_key");
  await fetch(`/api/admin/providers/${id}`, { method:"DELETE", headers: { "x-admin-key": key } });
  load();
}
async function adminLogin(){
  const username = document.getElementById("admin-username").value;
  const password = document.getElementById("admin-password").value;
  const errEl = document.getElementById("admin-login-error");
  errEl.style.display = "none";
  try{
    const res = await fetch("/api/admin/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || "بيانات الدخول غير صحيحة"; errEl.style.display = "block"; return; }
    localStorage.setItem("nagah_admin_key", data.admin_key);
    localStorage.setItem("nagah_admin_username", data.username);
    enterAdmin();
  }catch(e){ errEl.textContent = "حصل خطأ في الاتصال"; errEl.style.display = "block"; }
}
function adminLogout(){
  localStorage.removeItem("nagah_admin_key");
  localStorage.removeItem("nagah_admin_username");
  document.getElementById("admin-content").style.display = "none";
  document.getElementById("login-box").style.display = "block";
  document.getElementById("admin-username").value = "";
  document.getElementById("admin-password").value = "";
}
async function changeAdminPassword(){
  const np = prompt("اكتب كلمة السر الجديدة (6 حروف/أرقام على الأقل):");
  if(!np) return;
  const key = localStorage.getItem("nagah_admin_key");
  const username = localStorage.getItem("nagah_admin_username");
  const res = await fetch("/api/admin/change-password", { method:"POST", headers:{"Content-Type":"application/json", "x-admin-key": key}, body: JSON.stringify({ username, new_password: np }) });
  const data = await res.json().catch(()=>({}));
  if(res.ok) alert("تم تغيير كلمة السر بنجاح"); else alert("حصل خطأ: "+(data.error||"غير معروف"));
}
function enterAdmin(){
  document.getElementById("login-box").style.display = "none";
  document.getElementById("admin-content").style.display = "block";
  document.getElementById("admin-whoami").textContent = "مسجل دخول: "+(localStorage.getItem("nagah_admin_username")||"");
  load();
}
const savedKey = localStorage.getItem("nagah_admin_key");
if(savedKey){ enterAdmin(); }
</script>
</body>
</html>
