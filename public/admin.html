<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | نجاح</title>
<style>
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:#f7f8fb; margin:0; padding:20px; color:#1f2430;}
  .container{max-width:800px; margin:0 auto;}
  h1{font-size:20px; margin-bottom:6px;}
  .muted{color:#6b7280; font-size:13px; margin-bottom:16px;}
  .card{background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px; margin-bottom:12px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .btn{cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600;}
  .approve{background:#16a34a; color:#fff;} .reject{background:#dc2626; color:#fff;} .delete{background:#374151; color:#fff;}
  .suspend{background:#b45309; color:#fff;} .activate{background:#0d9488; color:#fff;} .reset{background:#4338ca; color:#fff;}
  .sub-ok{color:#16a34a; font-weight:700;} .sub-bad{color:#dc2626; font-weight:700;}
  input{padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; font-size:13px;}
  .empty{text-align:center; color:#6b7280; padding:30px;}
  .name{font-weight:700;} .tag{color:#2563eb; font-size:12px;} .tag-center{color:#a21caf;}
  .tabs{display:flex; gap:6px; margin:10px 0;}
  .tabs button{flex:1; padding:8px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; cursor:pointer; font-size:13px;}
  .tabs button.active{background:#111827; color:#fff; border-color:#111827;}
</style>
</head>
<body>
<div class="container">
  <h1>🎓 نجاح — لوحة إدارة المدرسين والمراكز</h1>
  <p class="muted">أدخل مفتاح الإدارة (Admin Key) لعرض الطلبات</p>
  <div class="card row">
    <input id="key" type="password" placeholder="Admin Key" style="flex:1;">
    <button class="btn approve" onclick="load()">دخول</button>
  </div>
  <div class="tabs">
    <button data-status="pending" class="active" onclick="setTab('pending')">قيد المراجعة</button>
    <button data-status="approved" onclick="setTab('approved')">المعتمدون</button>
    <button data-status="rejected" onclick="setTab('rejected')">مرفوضون</button>
  </div>
  <div id="list"></div>
</div>
<script>
let currentStatus = "pending";
function setTab(s){
  currentStatus = s;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active", b.dataset.status===s));
  load();
}
function modeLabel(m){ return m==="online" ? "أونلاين" : m==="in_person" ? "حضوري" : "أونلاين وحضوري"; }
async function load(){
  const key = document.getElementById("key").value;
  localStorage.setItem("nagah_admin_key", key);
  const res = await fetch("/api/admin/providers?status="+currentStatus, { headers: { "x-admin-key": key } });
  const list = document.getElementById("list");
  if(!res.ok){ list.innerHTML = '<div class="empty">مفتاح غير صحيح أو حصل خطأ</div>'; return; }
  const rows = await res.json();
  list.innerHTML = rows.length ? rows.map(p=>`
    <div class="card">
      <div class="row">
        <div>
          <div class="name">${p.name} <span class="${p.type==='center'?'tag-center':'tag'}">${p.type==='center' ? '🏫 مركز' : '🧑‍🏫 مدرس'} - ${p.subject}</span></div>
          <div style="font-size:13px; color:#6b7280;">📍 ${p.country}${p.area ? " - "+p.area : ""} | ${p.price} | 📞 ${p.phone} | ${modeLabel(p.mode)} | ${p.group_type==='group' ? 'مجموعة حتى '+p.max_students : 'فردي'} | دفع ${p.payment_method==='cash'?'نقدي':'تحويل'}</div>
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">${p.degree||""} ${p.experience_years?('- '+p.experience_years+' سنوات خبرة'):''} | جنسية: ${p.nationality||"-"} | ميلاد: ${p.dob||"-"}</div>
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">🕒 ${(p.availability_days&&p.availability_days.length) ? p.availability_days.join("، ") : "لم يحدد أيام"} ${(p.availability_from&&p.availability_to) ? ('| '+p.availability_from+' - '+p.availability_to) : ""}</div>
          ${p.subscription_start ? `<div style="font-size:12px; margin-top:4px;" class="${p.expired?'sub-bad':'sub-ok'}">📅 الاشتراك: من ${p.subscription_start.slice(0,10)} لحد ${p.subscription_end.slice(0,10)} — ${p.expired ? 'منتهي' : (p.days_left+' يوم متبقي')} ${p.active===false ? '(موقوف يدويًا)' : ''}</div>` : `<div style="font-size:12px; color:#6b7280; margin-top:4px;">📅 الاشتراك هيبدأ بمجرد القبول</div>`}
          <div style="font-size:12px; color:#6b7280; margin-top:4px;">${p.bio||""}</div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${currentStatus!=="approved" ? `<button class="btn approve" onclick="act(${p.id},'approve')">قبول</button>` : ""}
          ${currentStatus!=="rejected" ? `<button class="btn reject" onclick="act(${p.id},'reject')">رفض</button>` : ""}
          ${currentStatus==="approved" ? (p.active===false ? `<button class="btn activate" onclick="act(${p.id},'activate')">تفعيل الاشتراك</button>` : `<button class="btn suspend" onclick="act(${p.id},'suspend')">إيقاف الاشتراك</button>`) : ""}
          <button class="btn reset" onclick="resetPw(${p.id})">إعادة ضبط كلمة السر</button>
          <button class="btn delete" onclick="del(${p.id})">حذف نهائي</button>
        </div>
      </div>
    </div>`).join("") : '<div class="empty">لا يوجد أحد في هذه القائمة</div>';
}
async function act(id, action){
  const key = localStorage.getItem("nagah_admin_key") || document.getElementById("key").value;
  await fetch(`/api/admin/providers/${id}/${action}`, { method:"POST", headers: { "x-admin-key": key } });
  load();
}
async function resetPw(id){
  if(!confirm("هيتم توليد كلمة سر جديدة عشوائية لهذا الحساب. متأكد؟")) return;
  const key = localStorage.getItem("nagah_admin_key") || document.getElementById("key").value;
  const res = await fetch(`/api/admin/providers/${id}/reset-password`, { method:"POST", headers: { "x-admin-key": key } });
  const data = await res.json();
  if(data.new_password){ alert("كلمة السر الجديدة: "+data.new_password+"\nابعتها للمدرس/المركز بنفسك (واتساب/إيميل)."); }
  else { alert("حصل خطأ: "+(data.error||"غير معروف")); }
}
async function del(id){
  if(!confirm("متأكد إنك عايز تحذف ده نهائيًا؟ هيتحذف مع تقييماته وحجوزاته.")) return;
  const key = localStorage.getItem("nagah_admin_key") || document.getElementById("key").value;
  await fetch(`/api/admin/providers/${id}`, { method:"DELETE", headers: { "x-admin-key": key } });
  load();
}
const saved = localStorage.getItem("nagah_admin_key");
if(saved){ document.getElementById("key").value = saved; load(); }
</script>
</body>
</html>
